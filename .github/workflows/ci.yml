name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate config against live repos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # Fails if any tracked owner/repo/branch no longer resolves, or a
      # status_log.jsonl is missing/empty/malformed — the failure mode that
      # otherwise shows up only as an amber tab in the deployed dashboard.
      - name: Validate config.json
        run: python3 tools/validate_config.py
      # The validator is only trustworthy if it can be shown to fail. This is a
      # real regression guard: `ephapse` has no `dev` branch, yet
      # raw.githubusercontent.com serves 200 with main's content for it, so the
      # pre-git-refs validator reported it healthy. If this step breaks, the
      # blind spot is back.
      - name: Prove the validator can fail on broken input
        run: python3 tools/validate_config.py --self-test
      # Same rule for the automation sweep: it must be shown to fail. Guards the
      # stale-claim check in particular, since a silent regression there would
      # publish "0 stale claims" forever while locks leaked.
      - name: Prove the automation sweep can fail
        run: python3 automation_sweep.py --selftest